<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Our Home</title>
<meta name="theme-color" content="#eaf1ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Our Home">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#eaf1ff; --bg2:#f6f9ff; --card:#ffffff; --ink:#18264a; --ink2:#5d6b88; --line:#e7ecf5;
  --accent:#3b78e7; --accent-soft:#e6efff; --dark:#1b2b52; --good:#1f8a4c; --good-soft:#e3f6ea;
  --warn:#e39a1c; --red:#e2475b; --red-soft:#fde8eb;
  --hero1:#7fa5f7; --hero2:#86d7e8;
  --radius:24px; --shadow:0 6px 24px rgba(40,70,140,.08);
  --nav-h:76px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#0f1628; --bg2:#121b31; --card:#1a2440; --ink:#eef2fb; --ink2:#9aa6c2; --line:#26324f;
    --accent:#6f9cff; --accent-soft:#22345e; --dark:#dbe5ff; --good:#5fd08f; --good-soft:#173826;
    --red-soft:#3a1d25; --shadow:0 6px 24px rgba(0,0,0,.3);
    --hero1:#3d5fb0; --hero2:#2f8aa0;
  }
}
:root[data-theme="dark"]{
  --bg1:#0f1628; --bg2:#121b31; --card:#1a2440; --ink:#eef2fb; --ink2:#9aa6c2; --line:#26324f;
  --accent:#6f9cff; --accent-soft:#22345e; --dark:#dbe5ff; --good:#5fd08f; --good-soft:#173826;
  --red-soft:#3a1d25; --shadow:0 6px 24px rgba(0,0,0,.3);
  --hero1:#3d5fb0; --hero2:#2f8aa0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"DM Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,var(--bg1),var(--bg2) 40%);background-attachment:fixed;
  font-size:16px;-webkit-font-smoothing:antialiased}
h1,h2,.serif{font-family:"Fraunces",Georgia,serif;font-weight:700;letter-spacing:-.01em}
h1{font-size:34px;margin:6px 0 4px;line-height:1.1}
h2{font-size:22px;margin:26px 4px 12px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:13px 16px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{min-height:90px;resize:vertical}
#app,.sheet{overflow-wrap:break-word;word-break:break-word}
.grid2 .card .serif{font-size:clamp(19px,6vw,30px)!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row>*,.item>*{min-width:0}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom))}
.sub{color:var(--ink2);font-size:15px;margin:0 0 16px}
.muted{color:var(--ink2);font-size:14px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card+.card{margin-top:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:20px;padding:4px 16px;box-shadow:var(--shadow);margin:14px 0}
.search input{border:0;padding:12px 0;background:transparent}
.hero{border-radius:28px;padding:26px 20px;text-align:center;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#14224a;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.25)}
.hero .big{font-family:"Fraunces",serif;font-size:64px;line-height:1;margin:10px 0 4px;position:relative;z-index:1}
.hero .lbl{position:relative;z-index:1;opacity:.85}
.avatars{display:flex;justify-content:center;position:relative;z-index:1}
.av{width:46px;height:46px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;font-weight:700;color:#fff;font-size:18px}
.av+.av{margin-left:-10px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:10px 18px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:500;font-size:15px}
.chip.on{background:var(--dark);color:var(--card)}
.chip.sm{padding:7px 14px;font-size:14px;box-shadow:none;border:1px solid var(--line)}
.chip .n{display:inline-block;margin-left:6px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:0 8px;font-size:13px}
.chip.on .n{background:rgba(255,255,255,.2);color:inherit}
.list{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;gap:14px;align-items:flex-start;padding:15px 18px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:500;font-size:17px;word-break:break-word}
.item .s{color:var(--ink2);font-size:14px;margin-top:2px}
.tick{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid #b8c4d8;display:grid;place-items:center;margin-top:1px}
.tick.on{background:var(--accent);border-color:var(--accent);color:#fff}
.done .t{text-decoration:line-through;color:var(--ink2)}
.link{display:inline-block;margin:6px 6px 0 0;padding:4px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;text-decoration:none}
.btn{background:var(--dark);color:var(--card);border-radius:999px;padding:13px 22px;font-weight:600}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.red{background:var(--red-soft);color:var(--red)}
.btn.block{width:100%}
.tlink{color:var(--accent);font-weight:600;font-size:15px}
.fab{position:fixed;right:max(16px,calc(50vw - 264px));bottom:calc(var(--nav-h) + 34px + env(safe-area-inset-bottom));z-index:20;
  background:var(--dark);color:var(--card);border-radius:999px;padding:15px 22px;font-weight:600;box-shadow:0 8px 24px rgba(20,40,90,.3)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:calc(100% - 32px);max-width:528px;
  background:var(--card);border-radius:28px;box-shadow:0 8px 30px rgba(30,60,130,.14);display:flex;padding:8px;z-index:30;height:var(--nav-h)}
nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:18px;color:var(--ink2);font-size:10.5px;letter-spacing:-.1px;font-weight:500}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
nav svg{width:22px;height:22px}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:14px}
nav{padding:6px}
.ico{width:22px;height:22px;flex:none}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.warn{background:#fff2dc;color:#a96a00}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#7aa7ff);border-radius:99px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.mem{background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;padding:10px}
.mem .img{aspect-ratio:1;border-radius:16px;background:var(--accent-soft) center/cover no-repeat}
.mem .t{font-weight:600;margin:8px 4px 0}
.pray .pbar{height:4px;border-radius:99px;background:var(--line);margin:14px 0 12px;overflow:hidden}.pray .pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent-soft),var(--accent))}
.pseg{display:flex;gap:4px;background:var(--bg2);border-radius:14px;padding:4px}
.pseg div{flex:1;min-width:0;text-align:center;padding:6px 0;border-radius:10px;line-height:1.2}
.pseg span{display:block;font-size:11px;color:var(--ink2)}.pseg b{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.pseg .past{opacity:.45}.pseg .on{background:var(--card);box-shadow:0 2px 8px rgba(30,60,130,.12)}.pseg .on span,.pseg .on b{color:var(--accent)}
.otdrow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px 2px}
.otd{flex:0 0 128px;min-width:0}
.otd .pic{width:128px;height:128px;border-radius:16px;background:var(--accent-soft) center/cover no-repeat;display:grid;place-items:center;font-size:44px}
.otdbig{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--accent-soft);margin-bottom:10px}
.otdbig .e{font-size:30px}.otdbig b{display:block}.otdbig span{font-size:13px;color:var(--ink2)}
.otd .t{font-weight:600;font-size:14px;margin-top:6px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.otd .s{font-size:12px;color:var(--ink2);margin-top:2px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;gap:4px 0}
.cal .h{color:var(--ink2);font-size:13px;padding:6px 0}
.cal .d{position:relative;height:44px;display:grid;place-items:center;font-size:16px;border-radius:50%;width:44px;max-width:100%;aspect-ratio:1;height:auto;margin:0 auto}
.cal .d.today{background:var(--dark);color:var(--card);font-weight:700}
.cal .d.sel{outline:2px solid var(--accent)}
.cal .dots{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.cal .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cal .dots i.b{background:var(--warn)}
.sheet-bg{position:fixed;inset:0;background:rgba(15,25,50,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg2);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet h2{margin:0 0 14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:14px;color:var(--ink2);margin:0 0 6px 4px}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
@keyframes fade{from{opacity:0}}
.empty{padding:26px 18px;text-align:center;color:var(--ink2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 40px);background:var(--dark);color:var(--card);padding:10px 18px;border-radius:999px;z-index:60;font-size:14px;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.ms{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 6px}
.ms button{padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px}
.ms button.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.acc{display:flex;justify-content:space-between;align-items:center;width:100%;padding:4px 0;font-weight:700;font-size:17px}
.stat{display:flex;gap:0}
.stat>div{flex:1}
.stat>div+div{border-left:1px solid var(--line);padding-left:16px}
.legend{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.legend:last-child{border:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.note{white-space:pre-wrap}

/* ---------- opening screen + PIN ---------- */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;color:#fff;
  background:radial-gradient(120% 90% at 20% 10%,#7ea2ff 0%,#4a6fe0 38%,#22357f 100%);transition:opacity .6s ease,transform .6s ease}
#splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
.sp-glow{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(134,215,232,.55),transparent 65%);animation:glow 3.2s ease-in-out infinite alternate}
.sp-orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.5;background:rgba(255,255,255,.18)}
.o1{width:180px;height:180px;top:8%;left:-40px;animation:float 6s ease-in-out infinite}
.o2{width:120px;height:120px;bottom:12%;right:-20px;animation:float 7s ease-in-out infinite reverse}
.o3{width:60px;height:60px;top:22%;right:18%;animation:float 5s ease-in-out infinite}
.sp-center{position:relative;text-align:center;padding:0 24px}
.sp-logo{display:block;margin:0 auto;filter:drop-shadow(0 10px 30px rgba(0,0,0,.25))}
.sp-house{stroke-dasharray:240;stroke-dashoffset:240;animation:draw 1s .15s cubic-bezier(.6,0,.2,1) forwards}
.sp-heart{transform-origin:50px 60px;transform:scale(0);animation:pop .5s 1s cubic-bezier(.3,1.6,.5,1) forwards,beat 1.4s 1.6s ease-in-out infinite}
.sp-title{font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:40px;letter-spacing:-.01em;margin-top:14px;opacity:0;transform:translateY(12px);animation:rise .6s 1.05s ease-out forwards}
.sp-sub{font-size:16px;opacity:0;margin-top:6px;animation:rise .6s 1.3s ease-out forwards;min-height:22px;font-variant-numeric:tabular-nums}
#lockpad{margin-top:34px;animation:rise .4s ease-out}
.lp-label{opacity:.9;margin-bottom:14px}
.lp-dots{display:flex;gap:16px;justify-content:center;margin-bottom:26px}
.lp-dots i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.8);transition:background .15s}
.lp-dots i.on{background:#fff}
.lp-dots.shake{animation:shake .4s}
.lp-keys{display:grid;grid-template-columns:repeat(3,72px);gap:16px;justify-content:center}
.lp-keys button{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:28px;font-weight:500;backdrop-filter:blur(6px)}
.lp-keys button:active{background:rgba(255,255,255,.32)}
.lp-keys button.ghost{background:none;font-size:15px}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{transform:scale(1)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes glow{from{transform:scale(.85);opacity:.7}to{transform:scale(1.1);opacity:1}}
@keyframes float{50%{transform:translateY(-22px)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@media (prefers-reduced-motion: reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
.bell{position:absolute;top:calc(env(safe-area-inset-top) + 18px);right:16px;width:46px;height:46px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink)}
.bell .rd{position:absolute;top:8px;right:9px;width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid var(--card)}
#app{position:relative}
.feed-av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.thumb{flex:none;width:52px;height:52px;border-radius:12px;background:var(--accent-soft) center/cover no-repeat;position:relative}
.thumb.lg{width:84px;height:84px;border-radius:16px}
.thumb.add{display:grid;place-items:center;align-content:center;text-align:center;color:var(--accent);font-size:22px;line-height:1;border:2px dashed var(--accent-soft);background:var(--card);cursor:pointer}
.thumb.add span{font-size:11px;font-weight:600}
.thumb .rm{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:var(--dark);color:var(--card);font-size:16px;line-height:1}
.photo-row{display:flex;flex-wrap:wrap;gap:10px}
.msg-img{width:100%;max-width:260px;aspect-ratio:4/3;border-radius:16px;background:var(--accent-soft) center/cover no-repeat;margin-bottom:6px}
.lb{position:fixed;inset:0;z-index:90;background:rgba(5,10,25,.92);display:grid;place-items:center;padding:16px;animation:fade .15s}
.lb img{max-width:100%;max-height:100%;border-radius:12px}
.rmx{flex:none;align-self:center;width:34px;height:34px;border-radius:50%;background:var(--red-soft);color:var(--red);font-size:14px;font-weight:700}
.toast button{color:#9fc0ff;font-weight:700;margin-left:12px}
.x{float:right;font-size:26px;line-height:1;color:var(--ink2);padding:0 4px}
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="sp-glow"></div>
  <div class="sp-orb o1"></div><div class="sp-orb o2"></div><div class="sp-orb o3"></div>
  <div class="sp-center">
    <svg class="sp-logo" viewBox="0 0 100 100" width="112" height="112">
      <path class="sp-house" d="M22 50 L50 26 L78 50 V75 a3 3 0 0 1 -3 3 H25 a3 3 0 0 1 -3 -3 Z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
      <path class="sp-heart" d="M50 70 C38 62 40 52 46 52 C48.5 52 50 54 50 55.5 C50 54 51.5 52 54 52 C60 52 62 62 50 70Z" fill="#ff7d98"/>
    </svg>
    <div class="sp-title">Our Home</div>
    <div class="sp-sub" id="spSub"></div>
    <div id="lockpad" hidden>
      <div class="lp-label" id="lpLabel">Enter PIN</div>
      <div class="lp-dots" id="lpDots"><i></i><i></i><i></i><i></i></div>
      <div class="lp-keys"></div>
    </div>
  </div>
</div>
<div id="app"></div>
<nav id="nav"></nav>
<div id="sheet"></div>

<script>
/* =========================================================
   Our Home — shared family app (PWA)
   Data layer: localStorage now; sync layer can replace DB.save/load later.
   ========================================================= */
const KEY = 'ourhome.v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
// jq: a value placed inside a quoted JS string in an onclick attribute
const jq = s => esc(String(s ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n'));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RM = n => 'RM' + (Number(n) || 0).toLocaleString('en-MY', {minimumFractionDigits: 2, maximumFractionDigits: 2});
// add months without spilling over (31 Jan + 1 month = 28/29 Feb, not 3 Mar)
const addMonths = (iso, n) => { const [y, m, d] = iso.split('-').map(Number), t = new Date(y, m - 1 + n, 1), dim = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate(); t.setDate(Math.min(d, dim)); return isoOf(t); };
const fmtDate = (iso, opt = {day:'numeric', month:'short', year:'numeric'}) => iso ? new Date(iso + 'T00:00').toLocaleDateString('en-GB', opt) : '';
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / 86400000);

const DEFAULT = {
  settings: { nameA: 'You', nameB: 'Partner', me: 'A', startDate: '', babyName: '', babyDob: '', theme: 'auto', zone: 'WLY01', reminders: {bills: true, events: true, tasks: true, vaccines: true, who: 'both'} },
  tasks: [], restock: [], restockCats: ['Pantry', 'Baby', 'Household'],
  events: [], bills: [], growth: [], vaccines: {}, milestones: {}, memories: [],
  notes: [], recipes: [], wishes: [], goals: [], expenses: [], messages: [], babylog: [], sleepStart: null, settlements: [], activity: [], meals: {}, scheduled: [], cars: [], services: [], contacts: [], watch: [], activities: [], karaoke: []
};
const DB = {
  data: null,
  load(raw) {
    try { this.data = Object.assign(structuredClone(DEFAULT), JSON.parse(raw || localStorage.getItem(KEY) || '{}')); }
    catch (e) { this.data = structuredClone(DEFAULT); }
    this.data.settings = Object.assign({}, DEFAULT.settings, this.data.settings);
    ['Kitchen', 'Groceries'].forEach(old => { const ki = this.data.restockCats.indexOf(old); if (ki >= 0 && !this.data.restockCats.includes('Pantry')) { this.data.restockCats[ki] = 'Pantry'; this.data.restock.forEach(r => { if (r.cat === old) r.cat = 'Pantry'; }); } });
  },

    ${/^Paused/.test(SYNC.err) ? `<div class="card" style="background:var(--red-soft);box-shadow:none;margin-top:10px;padding:12px"><b>This phone looks emptier than the shared data.</b><div class="muted" style="font-size:13px;margin:4px 0 8px">Nothing was deleted. Tap below to bring the shared data back onto this phone.</div><button class="btn sm" onclick="syncRepair()">Restore shared data here</button></div>` : ''}

}
const netMsg = e => /fetch|network|load failed/i.test(e && e.message || '') ? 'No internet connection. Try again' : (e && e.message || 'Something went wrong');
async function syncSignIn() { try { const u = await SYNC.api.signIn(val('se').trim(), val('spw')); SYNC.user = u; await syncAfterLogin(); } catch (e) { toast(/invalid/i.test(e.message) ? 'Wrong email or password' : /confirm/i.test(e.message) ? 'Confirm your email first (check your inbox)' : netMsg(e)); } }
async function syncSignUp() { const e = val('se').trim(), p = val('spw'); if (!/^\S+@\S+\.\S+$/.test(e)) return toast('Enter a valid email'); if (p.length < 8) return toast('Password needs 8+ characters');
  try { const u = await SYNC.api.signUp(e, p); if (u) { SYNC.user = u; await syncAfterLogin(); } else sheet(`<h2>Check your email</h2><p class="muted">We sent a confirmation link to <b>${esc(e)}</b>. Tap it, then come back here and sign in.</p><button class="btn block" onclick="closeSheet()">OK</button>`); }
  catch (err) { toast(/registered|exists/i.test(err.message) ? 'That email already has an account. Sign in instead' : netMsg(err)); } }
async function syncReset() { const e = val('se').trim(); if (!e) return toast('Type your email first'); try { await SYNC.api.resetPw(e); toast('Password reset email sent'); } catch (err) { toast(netMsg(err)); } }
async function syncAfterLogin() { try { const hs = await SYNC.api.myHouseholds(); if (hs && hs.length) { await syncUseHousehold(hs[0], true); return; } } catch (e) {} SYNC.status = 'nohh'; render(); }
async function syncUseHousehold(h, joining) { SYNC.hh = h.id; SYNC.code = h.code; SYNC.setMeta({hh: h.id, code: h.code}); await SYNC.loadSnap(); SYNC.joined = !joining ? true : SYNC.joined; await SYNC.saveSnap(); render(); SYNC.start(); }
async function syncCreate() { try { const h = await SYNC.api.createHousehold(`${S().nameA} & ${S().nameB}`); await syncUseHousehold(Array.isArray(h) ? h[0] : h, false); toast('Household created. Share the code with your partner'); act('🏡', 'started our shared household'); DB.save(); } catch (e) { toast(netMsg(e)); } }
async function syncJoin() { const c = val('shc').trim().toUpperCase(); if (c.length < 6) return toast('Enter the 6-letter code');
  try { const h = await SYNC.api.joinHousehold(c); if (!h || (Array.isArray(h) && !h.length)) return toast('No household with that code'); await syncUseHousehold(Array.isArray(h) ? h[0] : h, true); toast('Joined! Bringing in your shared data…'); }
  catch (e) { toast(/not found|no household/i.test(e.message) ? 'No household with that code' : netMsg(e)); } }
async function syncRepair() { SYNC.snap = {}; SYNC.lastPull = '1970-01-01T00:00:00Z'; SYNC.joined = false; await SYNC.saveSnap(); SYNC.err = ''; SYNC.schedule(0); toast('Bringing shared data back…'); }
async function syncOut() { sheet(`<h2>Sign out?</h2><p class="muted">Your data stays on this phone, it just stops syncing.</p><div class="row" style="margin-top:14px"><button class="btn soft grow" onclick="closeSheet()">Cancel</button><button class="btn red grow" onclick="syncOutYes()">Sign out</button></div>`); }
async function syncOutYes() { await SYNC.api.signOut(); SYNC.stop(); SYNC.user = null; SYNC.hh = null; SYNC.code = ''; SYNC.setMeta({hh: null, code: ''}); closeSheet(); render(); }
function compress(file, max = 1200) {
  return new Promise(res => { const fr = new FileReader(); fr.onload = () => { const im = new Image(); im.onload = () => {
    const k = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas');
    c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    res(c.toDataURL('image/jpeg', .75)); }; im.src = fr.result; }; fr.readAsDataURL(file); });
}

function upcomingItems(nDays) {
  const t = todayISO(), end = new Date(); end.setDate(end.getDate() + nDays); const e = isoOf(end);
  const out = D().events.filter(x => x.date >= t && x.date <= e).map(x => ({title: x.title, date: x.date, kind: 'Event'}));
  D().tasks.filter(x => !x.done && x.due > t && x.due <= e).forEach(x => out.push({title: x.title, date: x.due, kind: 'Task'}));
  billDates(t, e).forEach(b => out.push(b));
  kidDates(t, e).filter(x => x.date > t).forEach(x => out.push(x));
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
function billDates(from, to) {
  const out = []; const d = new Date(from + 'T00:00'); d.setDate(1); const last = new Date(to + 'T00:00');
  while (d <= last) { const y = d.getFullYear(), m = d.getMonth(), key = `${y}-${String(m + 1).padStart(2, '0')}`;
    D().bills.filter(b => activeBill(b, key + '-01')).forEach(b => { const dim = new Date(y, m + 1, 0).getDate(); const day = Math.min(b.dueDay, dim);
      const iso = `${key}-${String(day).padStart(2, '0')}`; if (iso >= from && iso <= to && !(b.paid || []).includes(key)) out.push({title: b.name, date: iso, kind: 'Bill due', amount: b.amount, bill: b.id}); });
    d.setMonth(m + 1); }
  (D().scheduled || []).filter(x => !x.done && x.next >= from && x.next <= to).forEach(x => out.push({title: x.name, date: x.next, kind: 'Scheduled payment', amount: x.amount}));
  return out;
}

function vSearch() {

  else if (sub === 'School') { body = vSchool(kid); }
  else if (sub === 'Chores') { body = vChores(kid); }
  else if (sub === 'Milestones') {
    if (st.openBand === null) { const bi = BANDS.findIndex(b => age.mo >= b[1] && age.mo <= b[2]); st.openBand = bi < 0 ? BANDS.length - 1 : bi; }
    const nowMo = ageMoAt(todayISO());
    body = msSummary(nowMo) + `<p class="muted" style="margin:4px 4px 10px">Tick a milestone when it happens. The bar shows the typical age range, the line is today, and the green dot is when it happened. Tap a ticked one to change its date.</p>` + BANDS.map((b, i) => {
      const n = b[3].filter(m => D().milestones[m]).length, now = age.mo >= b[1] && age.mo <= b[2];
      return `<div class="card"><button class="acc" onclick="st.openBand=${st.openBand === i ? -1 : i};render()"><span>${b[0]} ${now ? '<span class="pill" style="background:var(--dark);color:var(--card)">NOW</span>' : ''}</span><span class="muted">${n}/${b[3].length} ${st.openBand === i ? '▴' : '▾'}</span></button>
      ${st.openBand === i ? `<div style="margin-top:6px">${b[3].map(m => msRow(m, nowMo)).join('')}</div>` : ''}</div>`;
    }).join('') + (() => { const custom = Object.keys(D().milestones).filter(k => !BANDS.some(b => b[3].includes(k)));
      return custom.length ? `<h2>Our own milestones</h2><div class="list">${custom.map(k => `<div class="item"><div class="grow"><div class="t">${esc(k)}</div><div class="s">${fmtDate(D().milestones[k])}</div></div></div>`).join('')}</div>` : ''; })()
      + `<button class="fab" onclick="msSheet()">+ New milestone</button>`;
  } else if (sub === 'Vaccines') {
    body = `<p class="muted" style="margin:4px 4px 10px">Based on Malaysia's national schedule. Your clinic's book is the final word.</p>` + VAX.map(([lbl, mo, list]) => {
      const due = addMonths(S().babyDob, mo), allDone = list.every(v => D().vaccines[v]);
      return `<div class="card"><div class="row" style="justify-content:space-between"><b>${lbl}</b>${allDone ? '<span class="pill good">Done</span>' : due < todayISO() ? '<span class="pill warn">Due</span>' : `<span class="muted">${fmtDate(due)}</span>`}</div>
      <div class="ms">${list.map(v => `<button class="${D().vaccines[v] ? 'on' : ''}" onclick="toggleVax('${jq(v)}')">${D().vaccines[v] ? '✓ ' : ''}${esc(v)}${D().vaccines[v] ? ' · ' + fmtDate(D().vaccines[v], {day:'numeric', month:'short'}) : ''}</button>`).join('')}</div></div>`;
    }).join('');
  } else {
    body = vGrowth(); if (false) body = `<div class="list">${g.map(x => `<div class="item" onclick="growthSheet('${x.id}')"><div class="grow"><div class="t">${fmtDate(x.date)}</div><div class="s">${[x.weight && x.weight + ' kg', x.height && x.height + ' cm', x.head && 'head ' + x.head + ' cm'].filter(Boolean).join(' · ')}</div></div></div>`).join('') || '<div class="empty">No measurements yet. Add the ones from the clinic book.</div>'}</div>
    <button class="fab" onclick="growthSheet()">+ New measurement</button>`;
  }
  return `<h1>Kids 🧒</h1><p class="sub">${esc(name)} is ${ageTxt}</p>${kidChips()}
  <div class="chips" style="margin-bottom:12px">${tabs.map(t => `<button class="chip ${sub === t ? 'on' : ''}" onclick="st.babyTab='${t}';render()">${{Today: '🍼 ', Growth: '📏 ', Vaccines: '💉 ', Milestones: '⭐ ', School: '🎒 ', Chores: '🧹 '}[t]}${t}</button>`).join('')}</div>${body}`;
}

function saveGrowth(id) { const o = {date: val('gd'), weight: val('gw'), height: val('gh'), head: val('gc')}; if (!o.weight && !o.height) return toast('Add weight or height');
  if (id) Object.assign(D().growth.find(g => g.id === id), o); else D().growth.push({id: uid(), ...o}); DB.save(); closeSheet(); render(); }
function growthChart(g) {
  const pts = g.filter(x => x.weight).sort((a, b) => a.date.localeCompare(b.date)); if (pts.length < 2) return '';
  const w = 320, h = 120, xs = pts.map(p => new Date(p.date).getTime()), ys = pts.map(p => +p.weight);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys) * .95, y1 = Math.max(...ys) * 1.03;
  const P = pts.map((p, i) => [16 + (xs[i] - x0) / (x1 - x0 || 1) * (w - 32), h - 16 - (ys[i] - y0) / (y1 - y0 || 1) * (h - 32)]);
  return `<div class="card" style="margin-bottom:12px"><div class="muted">Weight (kg)</div><svg viewBox="0 0 ${w} ${h}" width="100%"><polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${P.map(p => p.join(',')).join(' ')}"/>
  ${P.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--accent)"/><text x="${p[0]}" y="${p[1] - 8}" font-size="10" text-anchor="middle" fill="var(--ink2)">${ys[i]}</text>`).join('')}</svg></div>`;
}

function babyAgeAt(iso) { if (!S().babyDob || !iso || iso < S().babyDob) return ''; const b = new Date(S().babyDob + 'T00:00'), n = new Date(iso + 'T00:00');

/* ----- Savings goals ----- */
function vGoals() {
  const gs = [...D().goals].sort((a, b) => (a.date || '9').localeCompare(b.date || '9') || (b.saved / b.target) - (a.saved / a.target));
  return `<h1>Savings goals 💰</h1><p class="sub">Sorted by target date, then by how close you are.</p>
  ${gs.map(g => { const pct = Math.min(100, Math.round(g.saved / g.target * 100)), left = Math.max(0, g.target - g.saved);
    let months = null, need = null, pace = null;
    if (g.date) { const n = new Date(), d = new Date(g.date + 'T00:00'); months = Math.max(0, (d.getFullYear() - n.getFullYear()) * 12 + d.getMonth() - n.getMonth()); need = months ? left / months : left; }
    const hist = (g.log || []).filter(l => l.amt > 0); if (hist.length) { const firstAt = Math.min(...hist.map(l => l.at)); const mo = Math.max(1, (Date.now() - firstAt) / (30.4 * 864e5)); pace = hist.reduce((s, l) => s + l.amt, 0) / mo; }
    const onTrack = pace !== null && need !== null ? pace >= need : null;
    return `<div class="card"><div class="row" style="justify-content:space-between"><b style="font-size:19px">${esc(g.name)}</b><button class="tlink" onclick="goalSheet('${g.id}')">Edit ›</button></div>
    ${g.date ? `<div class="muted">in ${months} month${months === 1 ? '' : 's'} · ${fmtDate(g.date)}</div>` : ''}
    <div style="margin-top:10px"><span class="serif" style="font-size:30px">${RM(g.saved).replace('.00', '')}</span> <span class="muted">of ${RM(g.target).replace('.00', '')} · ${pct}%</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div><div class="muted">${left ? RM(left) + ' to go' : 'Goal reached 🎉'}</div>
    ${left && need !== null ? `<div class="pill ${onTrack === false ? 'warn' : 'good'}" style="margin-top:10px;display:block;padding:8px 12px;font-weight:500">${onTrack === null ? `Save about ${RM(need)} a month to reach it` : onTrack ? `On track · saving about ${RM(pace)} a month, needs ${RM(need)}` : `Behind · saving about ${RM(pace)} a month, needs ${RM(need)}`}</div>` : ''}
    <div class="row" style="margin-top:12px"><button class="btn soft" style="padding:9px 16px" onclick="addSave('${g.id}',50)">+RM50</button><button class="tlink" onclick="saveAmtSheet('${g.id}')">Add / withdraw</button></div></div>`; }).join('') || '<div class="card empty">No goals yet</div>'}
  <button class="fab" onclick="goalSheet()">+ New goal</button>`;
}
function addSave(id, amt) { const g = D().goals.find(x => x.id === id); g.saved = Math.max(0, g.saved + amt); (g.log = g.log || []).push({amt, at: Date.now(), by: S().me}); DB.save(); render(); toast((amt > 0 ? 'Added ' : 'Withdrew ') + RM(Math.abs(amt))); }

function vExpenses() {

  <div class="hero" id="expcard" style="text-align:left"><div class="lbl">Total for the month</div><div class="big" style="font-size:52px">RM ${Number(whole).toLocaleString()}<span style="font-size:26px">.${cents}</span></div>
  ${inc ? `<div class="lbl">Commitments ${RM(comTot)} · Everyday ${RM(everyday)}</div>` : ''}
  <div class="lbl" style="font-size:13px;margin-top:2px">${esc(S().nameA)} ${RM(byWhoAll('A'))} · ${esc(S().nameB)} ${RM(byWhoAll('B'))}${inc && coms.some(c => c.payer === 'both') ? ' (shared split 50/50)' : ''}</div></div>

  </div>` : ''}
  ${unpaidC.length ? `<div class="card row" style="margin-top:12px" onclick="go('money','Bills')"><div style="font-size:22px">📌</div><div class="grow"><b>${unpaidC.length} commitment${unpaidC.length > 1 ? 's' : ''} not ticked as paid yet</b><div class="muted" style="font-size:13px">${RM(unpaidC.reduce((s, c) => s + c.amount, 0))} · counted in the total already</div></div><span class="tlink">›</span></div>` : ''}
  <h2>${inc ? 'Everyday spending' : 'All spending'}</h2><div class="list">${list.map(e => `<div class="item" onclick="expSheet('${e.id}')"><div class="grow"><div class="t">${esc(e.note || e.cat)}</div><div class="s">${e.cat} · ${esc(whoName(e.who))} · ${fmtDate(e.date, {day:'numeric', month:'short'})}</div></div><b>${RM(e.amount)}</b></div>`).join('') || '<div class="empty">No spending this month</div>'}</div>

function donut(rows, tot) {

  return `<svg viewBox="0 0 200 200" style="display:block;margin:0 auto 10px;max-width:220px">${segs}<text x="100" y="95" text-anchor="middle" font-size="13" fill="var(--ink2)">${rows[0][0]}</text><text x="100" y="120" text-anchor="middle" font-size="26" font-weight="700" fill="var(--ink)" font-family="Fraunces,serif">${Math.round(rows[0][2] / tot * 100)}%</text></svg>`;
}

function saveExp(id) { const a = parseFloat(val('xa')); if (!a) return toast('Enter an amount'); const o = {amount: a, date: val('xd'), cat: val('xc'), who: val('xw'), note: val('xn')};

/* ----- Bills ----- */
const CTYPES = [['Loan', '🏠', '#5b7fd6'], ['Insurance', '🛡️', '#4fc1c9'], ['Utilities', '💡', '#e6c34a'], ['Childcare', '🧸', '#e57fa5'], ['Education', '🎓', '#f0a35e'], ['Subscription', '📺', '#8f6fd6'], ['Savings', '🏦', '#5fbf8f'], ['Other', '📌', '#8a9bb5']];

const activeBill = (b, iso) => !b.endDate || (iso || todayISO()).slice(0, 7) <= b.endDate.slice(0, 7);
function monthsLeft(b) { if (!b.endDate) return null; const n = new Date(), e = new Date(b.endDate + 'T00:00'); return Math.max(0, (e.getFullYear() - n.getFullYear()) * 12 + e.getMonth() - n.getMonth() + 1); }
function vBills() {

  const tabs = `<div class="chips" style="margin-bottom:12px">${[['monthly', '📅 Monthly'], ['scheduled', '🗓️ Scheduled' + (sch.filter(x => !x.done).length ? ' · ' + sch.filter(x => !x.done).length : '')]].map(([k, l]) => `<button class="chip ${st.commitView === k ? 'on' : ''}" onclick="st.commitView='${k}';render()">${l}</button>`).join('')}</div>`;
  return st.commitView === 'scheduled' ? vScheduled(tabs) : vMonthly(tabs);
}
function vMonthly(tabs) {
  const n = new Date(), key = `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}`;

  return `<h1>Commitments 📌</h1>${tabs}<p class="sub">Paid every month: loans, insurance, bills, fees. Tick when paid; it also logs the expense.</p>

  ${byType.length ? `<div class="card" style="margin-top:12px"><div style="display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;margin-bottom:10px">${byType.map(x => `<i style="flex:${x[3]};background:${x[2]}"></i>`).join('')}</div>
    ${byType.map(([t, ic, col, v]) => `<div class="legend"><span><span class="dot" style="background:${col}"></span>${ic} ${t}</span><span><b>${RM(v)}</b> <span class="muted" style="font-size:13px">${Math.round(v / total * 100)}%</span></span></div>`).join('')}</div>` : ''}
  <div class="card" style="margin-top:12px" onclick="incomeSheet()">${income ? `<div class="row" style="justify-content:space-between"><div><div class="muted">Commitments vs income</div><div class="serif" style="font-size:28px">${pct}%</div></div><span class="pill ${level[0]}">${level[1]}</span></div>
    <div class="bar"><i style="width:${Math.min(100, pct)}%;${level[0] === 'red' ? 'background:var(--red)' : level[0] === 'warn' ? 'background:var(--warn)' : ''}"></i></div><div class="muted" style="font-size:13px">${RM(total)} of ${RM(income)} household income · ${RM(Math.max(0, income - total))} left after commitments · tap to edit</div>`

    return `<div class="item ${paid ? 'done' : ''}"><button class="tick ${paid ? 'on' : ''}" onclick="payBill('${b.id}')">${paid ? I.check : ''}</button>

    ${paid && (b.paidOn || {})[key] ? `<div class="s" style="color:var(--good)">✓ Paid on ${fmtDate(b.paidOn[key], {day: 'numeric', month: 'short'})}</div>` : ''}

    ${ml !== null && b.startDate ? (() => { const tot = Math.max(1, monthsBetween(b.startDate, b.endDate) + 1), done = Math.min(tot, tot - ml); return `<div class="bar" style="height:6px;margin:6px 0 2px"><i style="width:${Math.round(done / tot * 100)}%"></i></div><div class="s" style="font-size:12px">${done} of ${tot} paid · ${Math.round(done / tot * 100)}%</div>`; })() : ''}</div><b>${RM(b.amount)}</b></div>`; }).join('') || '<div class="empty">Nothing yet. Add your house or car loan, insurance, electricity, internet, phone, nursery fees…</div>'}</div>

/* =================== PRAYER TIMES (calculated on the phone, JAKIM settings) =================== */
const ZONES = [
  ['WLY01', 'Kuala Lumpur / Putrajaya', 3.139, 101.687], ['SGR01', 'Selangor: Gombak, Petaling, Hulu Langat (Ampang)', 3.15, 101.75],
  ['SGR02', 'Selangor: Kuala Selangor, Sabak Bernam', 3.34, 101.25], ['SGR03', 'Selangor: Klang, Kuala Langat', 3.04, 101.45],
  ['JHR02', 'Johor Bahru', 1.49, 103.74], ['PNG01', 'Pulau Pinang', 5.41, 100.33], ['PRK02', 'Perak: Ipoh', 4.6, 101.08],
  ['NGS01', 'Negeri Sembilan: Seremban', 2.73, 101.94], ['MLK01', 'Melaka', 2.19, 102.25], ['PHG02', 'Pahang: Kuantan', 3.82, 103.33],
  ['TRG01', 'Terengganu: Kuala Terengganu', 5.33, 103.14], ['KTN01', 'Kelantan: Kota Bharu', 6.13, 102.24], ['KDH01', 'Kedah: Alor Setar', 6.12, 100.37],
  ['SBH07', 'Sabah: Kota Kinabalu', 5.98, 116.07], ['SWK08', 'Sarawak: Kuching', 1.55, 110.34]
];
function prayerTimes(date, lat, lng, tz = 8) {
  const rad = Math.PI / 180, deg = 180 / Math.PI;
  const y = date.getFullYear(), m = date.getMonth() + 1, d = date.getDate();
  const jd = 367 * y - Math.floor(7 * (y + Math.floor((m + 9) / 12)) / 4) + Math.floor(275 * m / 9) + d + 1721013.5 - lng / 360;
  const D_ = jd - 2451545.0, g = (357.529 + 0.98560028 * D_) % 360, q = (280.459 + 0.98564736 * D_) % 360;
  const L = (q + 1.915 * Math.sin(g * rad) + 0.020 * Math.sin(2 * g * rad)) % 360, e = 23.439 - 0.00000036 * D_;
  const RA = Math.atan2(Math.cos(e * rad) * Math.sin(L * rad), Math.cos(L * rad)) * deg / 15;
  const decl = Math.asin(Math.sin(e * rad) * Math.sin(L * rad)) * deg;
  const EqT = q / 15 - ((RA % 24) + 24) % 24;
  const noon = 12 + tz - lng / 15 - EqT;
  const T = a => Math.acos((-Math.sin(a * rad) - Math.sin(decl * rad) * Math.sin(lat * rad)) / (Math.cos(decl * rad) * Math.cos(lat * rad))) * deg / 15;
  const asrA = -Math.atan(1 / (1 + Math.tan(Math.abs(lat - decl) * rad))) * deg;
  const h = v => { v = ((v % 24) + 24) % 24; const hh = Math.floor(v), mm = Math.round((v - hh) * 60); return mm === 60 ? [hh + 1, 0] : [hh, mm]; };
  const ihti = 2 / 60; // JAKIM-style safety minutes
  return [['Fajr', h(noon - T(20) + ihti)], ['Sunrise', h(noon - T(0.833) - ihti)], ['Dhuhr', h(noon + ihti)],
          ['Asr', h(noon + T(asrA) + ihti)], ['Maghrib', h(noon + T(0.833) + ihti)], ['Isha', h(noon + T(18) + ihti)]];
}
function prayerCard() {
  const z = ZONES.find(z => z[0] === S().zone) || ZONES[0], now = new Date();
  const list = prayerTimes(now, z[2], z[3]).filter(p => p[0] !== 'Sunrise');
  const mins = now.getHours() * 60 + now.getMinutes();
  let next = list.find(p => p[1][0] * 60 + p[1][1] > mins), tomorrow = false;
  if (!next) { const t = new Date(now); t.setDate(t.getDate() + 1); next = prayerTimes(t, z[2], z[3])[0]; tomorrow = true; }
  const diff = (next[1][0] * 60 + next[1][1] + (tomorrow ? 1440 : 0)) - mins;
  const f = t => String(t[0] > 12 ? t[0] - 12 : t[0] || 12) + ':' + String(t[1]).padStart(2, '0'), ap = t => t[0] >= 12 ? 'pm' : 'am';
  const toM = p => p[1][0] * 60 + p[1][1], prev = [...list].reverse().find(p => toM(p) <= mins);
  const pStart = prev ? toM(prev) : (toM(list[list.length - 1]) - 1440), pEnd = toM(next) + (tomorrow ? 1440 : 0);
  const prog = Math.max(0, Math.min(100, (mins - (tomorrow && prev ? toM(prev) : pStart)) / (pEnd - (tomorrow && prev ? toM(prev) : pStart)) * 100));
  const inTxt = (Math.floor(diff / 60) ? Math.floor(diff / 60) + 'h ' : '') + (diff % 60) + 'm';
  return `<div class="card pray" style="margin-top:12px">
  <div class="row" style="justify-content:space-between;align-items:flex-start"><div><div class="muted" style="font-size:12px;letter-spacing:.06em;text-transform:uppercase">Next prayer · ${esc(z[1].split(':').pop().split('/')[0].trim())}</div>
  <div class="row" style="align-items:baseline;gap:10px;margin-top:4px"><span style="font-weight:700;font-size:22px">${next[0]}</span><span style="font-size:30px;line-height:1;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums">${f(next[1])}</span><span class="muted" style="font-size:13px">${ap(next[1])}${tomorrow ? ' · tomorrow' : ''}</span></div></div>
  <span class="pill" style="background:var(--accent);color:#fff;font-size:12px;font-weight:600;white-space:nowrap">in ${inTxt}</span></div>
  <div class="pbar"><i style="width:${prog.toFixed(1)}%"></i></div>
  <div class="pseg">${list.map(p => { const isN = p[0] === next[0] && !tomorrow, past = !tomorrow && toM(p) <= mins || (tomorrow && false);
    return `<div class="${isN ? 'on' : past ? 'past' : ''}"><span>${p[0]}</span><b>${f(p[1])}</b></div>`; }).join('')}</div></div>`;
}

    `<button class="ghost" id="lpAlt" onclick="pinAlt()"></button><button onclick="pinKey('0')">0</button><button class="ghost" onclick="pinKey('del')">⌫</button>`;

const SLOTS = [['Breakfast', '🌅'], ['Lunch', '☀️'], ['Dinner', '🌙'], ['Baby', '👶']];
function weekStart(offset) { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + offset * 7); return d; }

function mealSheet(d, sl) {

const FREQ = {once: ['One-off', 0], quarterly: ['Every 3 months', 3], half: ['Every 6 months', 6], yearly: ['Every year', 12]};

function contactSheet(id) { const c = (D().contacts || []).find(x => x.id === id) || {name: '', phone: '', group: st.cGroup !== 'All' ? st.cGroup : 'Medical', role: '', note: '', star: false};
  sheet(`<h2>${id ? 'Contact' : 'New contact'}</h2>${field('Name', `<input id="kn" value="${esc(c.name)}" placeholder="e.g. Dr Aisyah">`)}
  ${field('Phone', `<input id="kp" type="tel" value="${esc(c.phone)}" placeholder="e.g. 012-345 6789">`)}
  <div class="grid2">${field('Group', `<select id="kg">${CGROUPS.map(g => `<option ${g[0] === c.group ? 'selected' : ''}>${g[0]}</option>`).join('')}</select>`)}${field('Role (optional)', `<input id="kr" value="${esc(c.role || '')}" placeholder="e.g. Paediatrician">`)}</div>
  ${field('Notes (address, hours…)', `<textarea id="kno" style="min-height:70px">${esc(c.note || '')}</textarea>`)}
  <label class="row" style="margin:4px 4px 16px"><input type="checkbox" id="ks" ${c.star ? 'checked' : ''} style="width:auto"> ⭐ Favourite</label>
  <button class="btn block" onclick="saveContact('${id || ''}')">Save</button>${id ? `<button class="btn red block" style="margin-top:10px" onclick="confirmDel(()=>delFrom('contacts','${id}'))">Delete</button>` : ''}`); }
function saveContact(id) { if (!val('kn') || !val('kp')) return toast('Add a name and phone number'); D().contacts = D().contacts || [];
  const o = {name: val('kn'), phone: val('kp'), group: val('kg'), role: val('kr'), note: document.getElementById('kno').value, star: document.getElementById('ks').checked};
  if (id) Object.assign(D().contacts.find(x => x.id === id), o); else { D().contacts.push({id: uid(), by: S().me, ...o}); act('📞', `added contact ${o.name}`); }
  DB.save(); closeSheet(); render(); }

/* =================== KIDS: CHORES & POCKET MONEY =================== */
const CREP = {daily: 'Every day', weekly: 'Once a week', once: 'One time'};
function choreDone(k, c) { const log = (k.choreLog || []).filter(l => l.chore === c.id); if (!log.length) return false;
  const last = log.reduce((a, b) => a.date > b.date ? a : b).date;
  return c.repeat === 'daily' ? last === todayISO() : c.repeat === 'weekly' ? last >= isoOf(weekStart(0)) : true; }
const kunit = k => k.unit === 'stars' ? 'stars' : 'RM';
const kamt = (k, n) => k.unit === 'stars' ? `${n} ⭐` : RM(n);
const kidEarned = k => (k.choreLog || []).reduce((a, l) => a + Number(l.reward || 0), 0);
const kidPaid = k => (k.payouts || []).reduce((a, p) => a + Number(p.amount || 0), 0);
function vChores(k) {
  k.chores = k.chores || []; k.choreLog = k.choreLog || []; k.payouts = k.payouts || [];
  const bal = kidEarned(k) - kidPaid(k), ws = isoOf(weekStart(0)), wk = k.choreLog.filter(l => l.date >= ws).reduce((a, l) => a + Number(l.reward || 0), 0);
  const open = k.chores.filter(c => !(c.repeat === 'once' && choreDone(k, c)));
  const hist = [...k.choreLog.map(l => ({at: l.date, t: `✓ ${l.title}`, a: '+' + kamt(k, l.reward)})), ...k.payouts.map(p => ({at: p.date, t: k.unit === 'stars' ? `🎁 ${p.note || 'Reward'}` : `💵 ${p.note || 'Paid out'}`, a: '−' + kamt(k, p.amount)}))].sort((a, b) => b.at.localeCompare(a.at)).slice(0, 15);
  return `<div class="hero" style="padding:22px 18px;text-align:center"><div class="lbl" style="margin-top:0">${esc(k.name)}'s ${k.unit === 'stars' ? 'stars' : 'pocket money'}</div><div class="big" style="font-size:46px">${kamt(k, Math.round(bal * 100) / 100)}</div><div class="lbl">${kamt(k, wk)} earned this week</div>
    <div class="row" style="justify-content:center;margin-top:12px;gap:8px;position:relative;z-index:1"><button class="btn sm" onclick="payoutSheet('${k.id}')">${k.unit === 'stars' ? '🎁 Use stars' : '💵 Pay out'}</button><button class="btn soft sm" onclick="choreSetSheet('${k.id}')">⚙︎ ${k.unit === 'stars' ? 'Stars' : 'RM'}</button></div></div>
  <h2>Chores</h2>
  <div class="list">${open.map(c => { const done = choreDone(k, c); return `<div class="item"><button class="tick ${done ? 'on' : ''}" onclick="toggleChore('${k.id}','${c.id}')">${done ? I.check : ''}</button>
    <div class="grow" onclick="choreSheet('${k.id}','${c.id}')"><div class="t" style="${done ? 'text-decoration:line-through;opacity:.6' : ''}">${esc(c.title)}</div><div class="s">${CREP[c.repeat]}${done ? (c.repeat === 'daily' ? ' · done today' : c.repeat === 'weekly' ? ' · done this week' : '') : ''}</div></div><span class="pill good" style="font-size:13px">+${kamt(k, c.reward)}</span></div>`; }).join('') || '<div class="empty">No chores yet. Try: make bed, tidy toys, help wash dishes, finish homework, solat on time.</div>'}</div>
  ${hist.length ? `<h2>History</h2><div class="list">${hist.map(h => `<div class="item"><div class="grow"><div class="t" style="font-size:15px">${esc(h.t)}</div><div class="s">${fmtDate(h.at, {weekday: 'short', day: 'numeric', month: 'short'})}</div></div><b style="font-size:15px">${h.a}</b></div>`).join('')}</div>` : ''}
  <button class="fab" onclick="choreSheet('${k.id}')">+ New chore</button>`;
}
function toggleChore(kid, cid) { const k = kidById(kid), c = k.chores.find(x => x.id === cid); k.choreLog = k.choreLog || [];
  if (choreDone(k, c)) { const l = k.choreLog.filter(x => x.chore === cid).reduce((a, b) => a.date > b.date ? a : b); k.choreLog = k.choreLog.filter(x => x !== l); }
  else { k.choreLog.push({id: uid(), chore: cid, title: c.title, reward: Number(c.reward) || 0, date: todayISO()}); act('⭐', `${k.name} did "${c.title}"`); toast(`+${kamt(k, c.reward)} for ${k.name}`); }
  DB.save(); render(); }
function choreSheet(kid, id) { const k = kidById(kid), c = (k.chores || []).find(x => x.id === id) || {title: '', reward: k.unit === 'stars' ? 1 : 1, repeat: 'daily'};
  sheet(`<h2>${id ? 'Edit chore' : 'New chore'}</h2>${field('Chore', `<input id="kht" value="${esc(c.title)}" placeholder="e.g. Make bed">`)}
  <div class="grid2">${field(k.unit === 'stars' ? 'Stars' : 'Reward RM', `<input id="khr" inputmode="decimal" value="${c.reward}">`)}${field('How often', `<select id="khp">${Object.entries(CREP).map(([v, l]) => `<option value="${v}" ${c.repeat === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`)}</div>
  <button class="btn block" onclick="saveChore('${kid}','${id || ''}')">Save</button>${id ? `<button class="btn red block" style="margin-top:10px" onclick="confirmDel(()=>{const k=kidById('${kid}');k.chores=k.chores.filter(x=>x.id!=='${id}');DB.save()})">Delete</button>` : ''}`); }
function saveChore(kid, id) { const k = kidById(kid); if (!val('kht')) return toast('What is the chore?');
  const o = {title: val('kht'), reward: parseFloat(val('khr')) || 0, repeat: val('khp')}; k.chores = k.chores || [];
  if (id) Object.assign(k.chores.find(x => x.id === id), o); else k.chores.push({id: uid(), ...o}); DB.save(); closeSheet(); render(); }
function payoutSheet(kid) { const k = kidById(kid), bal = Math.max(0, kidEarned(k) - kidPaid(k)), stars = k.unit === 'stars';
  sheet(`<h2>${stars ? 'Use stars' : 'Pay out'}</h2><p class="muted" style="margin-top:-6px">${esc(k.name)} has ${kamt(k, Math.round(bal * 100) / 100)}.</p>
  <div class="grid2">${field(stars ? 'Stars' : 'Amount RM', `<input id="kpa" inputmode="decimal" value="${Math.round(bal * 100) / 100}">`)}${field('For', `<input id="kpn" placeholder="${stars ? 'e.g. Ice cream, new toy' : 'e.g. Weekly pocket money'}">`)}</div>
  ${stars ? '' : `<label class="row" style="margin:4px 0 14px;gap:10px"><input type="checkbox" id="kpe" checked style="width:auto"> Record in Expenses</label>`}
  <button class="btn block" onclick="savePayout('${kid}')">Save</button>`); }
function savePayout(kid) { const k = kidById(kid), a = parseFloat(val('kpa')) || 0; if (!a) return toast('Enter an amount');
  k.payouts = k.payouts || []; k.payouts.push({id: uid(), amount: a, date: todayISO(), note: val('kpn')});
  if (k.unit !== 'stars' && document.getElementById('kpe')?.checked) D().expenses.push({id: uid(), amount: a, date: todayISO(), cat: 'Baby', who: S().me, note: `${k.name} pocket money${val('kpn') ? ' · ' + val('kpn') : ''}`});
  act(k.unit === 'stars' ? '🎁' : '💵', `${k.name}: ${k.unit === 'stars' ? 'used' : 'paid'} ${kamt(k, a)}`); DB.save(); closeSheet(); render(); }
function choreSetSheet(kid) { const k = kidById(kid);
  sheet(`<h2>Rewards for ${esc(k.name)}</h2><p class="muted" style="margin-top:-6px">Stars suit little ones (swap for treats). Ringgit suits older kids learning about money.</p>
  <div class="row" style="margin-top:12px"><button class="btn ${k.unit !== 'stars' ? '' : 'soft'} grow" onclick="kidById('${kid}').unit='rm';DB.save();closeSheet();render()">💵 Ringgit</button><button class="btn ${k.unit === 'stars' ? '' : 'soft'} grow" onclick="kidById('${kid}').unit='stars';DB.save();closeSheet();render()">⭐ Stars</button></div>`); }


/* =================== ACTIVITIES & CALENDAR: TO WATCH + ACTIVITIES =================== */
function vCalendar() {
  const v = st.planView || 'cal';
  const chips = `<div class="chips" style="margin-bottom:12px">${[['cal', '📅 Calendar'], ['watch', '🍿 Watch'], ['act', '🎯 Activities'], ['karaoke', '🎤 Karaoke']].map(([k, l]) => `<button class="chip ${v === k ? 'on' : ''}" onclick="st.planView='${k}';render()">${l}</button>`).join('')}</div>`;
  return `<h1 style="font-size:30px">Activities & Calendar</h1>` + chips + (v === 'watch' ? vWatch() : v === 'act' ? vActs() : v === 'karaoke' ? vKaraoke() : vCalOnly());
}
const WTYPES = [['Movie', '🎬'], ['Series', '📺'], ['Video', '▶️'], ['Documentary', '🌍'], ['Anime', '🍥']];
const WHERE = ['Netflix', 'Disney+ Hotstar', 'Prime Video', 'YouTube', 'Viu', 'iQIYI', 'Apple TV+', 'HBO Max', 'Astro', 'Cinema', 'Other'];
const WSTAT = [['want', 'Want to watch'], ['watching', 'Watching'], ['done', 'Watched']];
const stars = n => n ? '★'.repeat(n) + '<span style="opacity:.3">' + '★'.repeat(5 - n) + '</span>' : '';
function vWatch() {
  D().watch = D().watch || []; const f = st.watchStat || 'want', all = D().watch, l = all.filter(w => (w.status || 'want') === f);
  l.sort((a, b) => f === 'done' ? (b.doneAt || '').localeCompare(a.doneAt || '') : (b.added || 0) - (a.added || 0));
  const cnt = s => all.filter(w => (w.status || 'want') === s).length;
  return `<p class="sub">Movies, series and videos we want to watch together.</p>
  <div class="chips" style="margin-bottom:10px">${WSTAT.map(([k, lb]) => `<button class="chip sm ${f === k ? 'on' : ''}" onclick="st.watchStat='${k}';render()">${lb}<span class="n">${cnt(k)}</span></button>`).join('')}</div>
  ${f === 'want' && l.length > 1 ? `<button class="btn soft block" style="margin-bottom:12px" onclick="pickWatch()">🎲 Pick something for tonight</button>` : ''}
  <div class="list">${l.map(w => { const t = WTYPES.find(x => x[0] === w.type) || WTYPES[0];
    return `<div class="item" onclick="watchSheet('${w.id}')"><div style="font-size:26px">${t[1]}</div><div class="grow"><div class="t">${esc(w.title)}</div>
    <div class="s">${[w.type, w.where, w.status === 'watching' && w.type !== 'Movie' && (w.season || w.ep) ? `S${w.season || 1} E${w.ep || 1}` : '', w.status === 'done' && w.doneAt ? fmtDate(w.doneAt, {day: 'numeric', month: 'short', year: 'numeric'}) : '', w.by ? 'added by ' + whoName(w.by) : ''].filter(Boolean).map(esc).join(' · ')}</div>
    ${w.rating ? `<div style="color:var(--warn);font-size:14px;margin-top:2px">${stars(w.rating)}</div>` : ''}</div>
    ${w.status === 'watching' && w.type !== 'Movie' ? `<button class="btn soft sm" onclick="event.stopPropagation();nextEp('${w.id}')">+1 ep</button>` : w.status !== 'done' ? `<button class="btn soft sm" onclick="event.stopPropagation();watchDone('${w.id}')">✓</button>` : ''}</div>`; }).join('')
    || `<div class="empty">${f === 'want' ? 'Nothing on the list yet. Add a movie or series you both want to see.' : f === 'watching' ? 'Nothing in progress.' : 'Nothing watched yet.'}</div>`}</div>
  <button class="fab" onclick="watchSheet()">+ Add to watch</button>`;
}
function watchSheet(id) { const w = (D().watch || []).find(x => x.id === id) || {title: '', type: 'Movie', where: 'Netflix', status: st.watchStat || 'want', season: '', ep: '', rating: 0, note: '', link: ''};
  sheet(`<h2>${id ? 'Edit' : 'Add to watch'}</h2>${field('Title', `<input id="wt" value="${esc(w.title)}" placeholder="e.g. Oppenheimer, Squid Game">`)}
  ${field('Type', `<div class="chips" id="wty" style="flex-wrap:wrap">${WTYPES.map(([t, ic]) => `<button type="button" class="chip sm ${w.type === t ? 'on' : ''}" data-t="${t}" onclick="document.querySelectorAll('#wty .chip').forEach(c=>c.classList.toggle('on',c===this))">${ic} ${t}</button>`).join('')}</div>`)}
  <div class="grid2">${field('Where', `<select id="ww">${WHERE.map(o => `<option ${w.where === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`)}${field('Status', `<select id="ws">${WSTAT.map(([k, l]) => `<option value="${k}" ${w.status === k ? 'selected' : ''}>${l}</option>`).join('')}</select>`)}</div>
  <div class="grid2">${field('Season (series)', `<input id="wse" inputmode="numeric" value="${w.season || ''}">`)}${field('Episode', `<input id="wep" inputmode="numeric" value="${w.ep || ''}">`)}</div>
  ${field('Our rating', `<div class="row" id="wra" style="gap:4px">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-n="${n}" style="font-size:28px;color:${n <= (w.rating || 0) ? 'var(--warn)' : 'var(--line)'}" onclick="document.querySelectorAll('#wra button').forEach(b=>b.style.color=+b.dataset.n<=${n}?'var(--warn)':'var(--line)');document.getElementById('wra').dataset.v=${n}">★</button>`).join('')}</div>`)}
  ${field('Link or note (optional)', `<input id="wn" value="${esc(w.note || '')}" placeholder="Trailer link, who recommended it…">`)}
  <button class="btn block" onclick="saveWatch('${id || ''}')">Save</button>
  ${id ? `<button class="btn soft block" style="margin-top:10px" onclick="planWatch('${id}')">📅 Plan a movie night</button><button class="btn red block" style="margin-top:10px" onclick="confirmDel(()=>delFrom('watch','${id}'))">Delete</button>` : ''}`);
  const r = document.getElementById('wra'); if (r) r.dataset.v = w.rating || 0; }
function saveWatch(id) { if (!val('wt')) return toast('Add a title'); const t = document.querySelector('#wty .chip.on');
  const o = {title: val('wt'), type: t ? t.dataset.t : 'Movie', where: val('ww'), status: val('ws'), season: parseInt(val('wse')) || '', ep: parseInt(val('wep')) || '', rating: +document.getElementById('wra').dataset.v || 0, note: val('wn')};
  D().watch = D().watch || []; const x = D().watch.find(w => w.id === id);
  if (o.status === 'done' && (!x || x.status !== 'done')) o.doneAt = todayISO();
  if (x) Object.assign(x, o); else { D().watch.push({id: uid(), by: S().me, added: Date.now(), ...o}); act('🍿', `added "${o.title}" to watch`); }
  st.watchStat = o.status; DB.save(); closeSheet(); render(); }
function watchDone(id) { const w = D().watch.find(x => x.id === id); w.status = 'done'; w.doneAt = todayISO(); act('🍿', `watched "${w.title}"`); DB.save(); render(); toast('Moved to Watched. Tap it to rate'); }
function nextEp(id) { const w = D().watch.find(x => x.id === id); w.ep = (parseInt(w.ep) || 0) + 1; w.season = w.season || 1; DB.save(); render(); toast(`${w.title}: S${w.season} E${w.ep}`); }
function pickWatch() { const l = D().watch.filter(w => (w.status || 'want') === 'want'); const w = l[Math.floor(Math.random() * l.length)]; const t = WTYPES.find(x => x[0] === w.type) || WTYPES[0];
  sheet(`<div style="text-align:center"><div style="font-size:56px;margin-top:6px">${t[1]}</div><h2 style="margin:8px 0 4px">${esc(w.title)}</h2><p class="muted">${esc([w.type, w.where].filter(Boolean).join(' · '))}</p></div>
  <div class="row" style="margin-top:14px"><button class="btn soft grow" onclick="pickWatch()">🎲 Again</button><button class="btn grow" onclick="const w=D().watch.find(x=>x.id==='${w.id}');w.status='watching';DB.save();closeSheet();st.watchStat='watching';render();toast('Enjoy! 🍿')">Watch this</button></div>`); }
function planWatch(id) { const w = D().watch.find(x => x.id === id); closeSheet(); planSheet(`🍿 ${w.title}`, 'watch-' + id); }

const ACATS = [['Adventure', '🧗'], ['Outdoor', '🏕️'], ['Water', '🛶'], ['Food', '🍜'], ['Travel', '✈️'], ['Indoor', '🎳'], ['Class', '🎨'], ['Other', '✨']];
function vActs() {
  D().activities = D().activities || []; const f = st.actStat || 'todo', all = D().activities;
  const l = all.filter(a => f === 'done' ? a.done : !a.done).sort((a, b) => f === 'done' ? (b.doneAt || '').localeCompare(a.doneAt || '') : (a.date || '9999').localeCompare(b.date || '9999') || (b.added || 0) - (a.added || 0));
  const t = todayISO();
  return `<p class="sub">Things we want to do together, like rafting, paintball or a cooking class.</p>
  <div class="chips" style="margin-bottom:10px">${[['todo', 'Want to do'], ['done', 'Done']].map(([k, lb]) => `<button class="chip sm ${f === k ? 'on' : ''}" onclick="st.actStat='${k}';render()">${lb}<span class="n">${all.filter(a => k === 'done' ? a.done : !a.done).length}</span></button>`).join('')}</div>
  ${f === 'todo' && l.length > 1 ? `<button class="btn soft block" style="margin-bottom:12px" onclick="pickAct()">🎲 Surprise us</button>` : ''}
  <div class="list">${l.map(a => { const c = ACATS.find(x => x[0] === a.cat) || ACATS[7];
    return `<div class="item" onclick="actSheet('${a.id}')"><div style="font-size:26px">${c[1]}</div><div class="grow"><div class="t">${esc(a.title)}</div>
    <div class="s">${[a.place, a.cost ? RM(a.cost) + ' each' : '', a.done && a.doneAt ? fmtDate(a.doneAt, {day: 'numeric', month: 'short', year: 'numeric'}) : ''].filter(Boolean).map(esc).join(' · ')}</div>
    ${a.rating ? `<div style="color:var(--warn);font-size:14px;margin-top:2px">${stars(a.rating)}</div>` : ''}</div>
    ${!a.done && a.date ? `<span class="pill ${a.date < t ? 'warn' : ''}" style="font-size:12px">📅 ${fmtDate(a.date, {day: 'numeric', month: 'short'})}</span>` : ''}</div>`; }).join('')
    || `<div class="empty">${f === 'todo' ? 'Start your bucket list: white-water rafting, paintball, hot air balloon, glamping…' : 'Nothing done yet. Go have fun!'}</div>`}</div>
  <button class="fab" onclick="actSheet()">+ Add activity</button>`;
}
function actSheet(id) { const a = (D().activities || []).find(x => x.id === id) || {title: '', cat: 'Adventure', place: '', cost: '', date: '', note: '', rating: 0, done: false};
  sheet(`<h2>${id ? 'Activity' : 'New activity'}</h2>${field('What', `<input id="at" value="${esc(a.title)}" placeholder="e.g. White-water rafting">`)}
  ${field('Type', `<div class="chips" id="aty" style="flex-wrap:wrap">${ACATS.map(([t, ic]) => `<button type="button" class="chip sm ${a.cat === t ? 'on' : ''}" data-t="${t}" onclick="document.querySelectorAll('#aty .chip').forEach(c=>c.classList.toggle('on',c===this))">${ic} ${t}</button>`).join('')}</div>`)}
  <div class="grid2">${field('Where', `<input id="ap" value="${esc(a.place || '')}" placeholder="e.g. Gopeng">`)}${field('Cost per person RM', `<input id="ac" inputmode="decimal" value="${a.cost || ''}">`)}</div>
  ${field('Planned date (optional, adds to Calendar)', `<input type="date" id="ad" value="${a.date || ''}">`)}
  ${field('Notes', `<input id="an" value="${esc(a.note || '')}" placeholder="Booking link, what to bring…">`)}
  ${a.done ? field('How was it?', `<div class="row" id="ara" style="gap:4px">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-n="${n}" style="font-size:28px;color:${n <= (a.rating || 0) ? 'var(--warn)' : 'var(--line)'}" onclick="document.querySelectorAll('#ara button').forEach(b=>b.style.color=+b.dataset.n<=${n}?'var(--warn)':'var(--line)');document.getElementById('ara').dataset.v=${n}">★</button>`).join('')}</div>`) : ''}
  <button class="btn block" onclick="saveAct('${id || ''}')">Save</button>
  ${id ? `${a.done ? `<button class="btn soft block" style="margin-top:10px" onclick="actUndo('${id}')">Move back to Want to do</button>` : `<button class="btn soft block" style="margin-top:10px" onclick="actDone('${id}')">✓ We did it!</button>`}<button class="btn red block" style="margin-top:10px" onclick="confirmDel(()=>{delFrom('activities','${id}');D().events=D().events.filter(e=>e.id!=='act-${id}');DB.save()})">Delete</button>` : ''}`);
  const r = document.getElementById('ara'); if (r) r.dataset.v = a.rating || 0; }
function saveAct(id) { if (!val('at')) return toast('What is the activity?'); const t = document.querySelector('#aty .chip.on'), r = document.getElementById('ara');
  const o = {title: val('at'), cat: t ? t.dataset.t : 'Other', place: val('ap'), cost: parseFloat(val('ac')) || '', date: val('ad'), note: val('an')}; if (r) o.rating = +r.dataset.v || 0;
  D().activities = D().activities || []; if (!id) { id = uid(); D().activities.push({id, by: S().me, added: Date.now(), done: false, ...o}); act('🎯', `added "${o.title}" to activities`); } else Object.assign(D().activities.find(x => x.id === id), o);
  syncActEvent(id); DB.save(); closeSheet(); render(); }
// a planned activity shows in the calendar as an event with a fixed id, so it updates instead of duplicating
function syncActEvent(id) { const a = D().activities.find(x => x.id === id), eid = 'act-' + id; D().events = D().events.filter(e => e.id !== eid);
  if (a && a.date && !a.done) D().events.push({id: eid, title: `🎯 ${a.title}`, date: a.date, note: [a.place, a.note].filter(Boolean).join(' · '), by: a.by || S().me}); }
function actDone(id) { const a = D().activities.find(x => x.id === id); a.done = true; a.doneAt = a.date && a.date <= todayISO() ? a.date : todayISO(); syncActEvent(id); act('🎉', `did "${a.title}"`); DB.save(); closeSheet(); st.actStat = 'done'; render(); actSheet(id); toast('Nice! Give it a rating'); }
function actUndo(id) { const a = D().activities.find(x => x.id === id); a.done = false; a.doneAt = ''; syncActEvent(id); DB.save(); closeSheet(); st.actStat = 'todo'; render(); }
function pickAct() { const l = D().activities.filter(a => !a.done); const a = l[Math.floor(Math.random() * l.length)], c = ACATS.find(x => x[0] === a.cat) || ACATS[7];
  sheet(`<div style="text-align:center"><div style="font-size:56px;margin-top:6px">${c[1]}</div><h2 style="margin:8px 0 4px">${esc(a.title)}</h2><p class="muted">${esc([a.place, a.cost ? RM(a.cost) + ' each' : ''].filter(Boolean).join(' · '))}</p></div>
  <div class="row" style="margin-top:14px"><button class="btn soft grow" onclick="pickAct()">🎲 Again</button><button class="btn grow" onclick="closeSheet();actSheet('${a.id}')">Plan it</button></div>`); }
function planSheet(title, eid) { const ex = D().events.find(e => e.id === eid);
  sheet(`<h2>Plan it</h2><p class="muted" style="margin-top:-6px">${esc(title)}</p><div class="grid2">${field('Date', `<input type="date" id="pd" value="${ex ? ex.date : todayISO()}">`)}${field('Time', `<input type="time" id="ph" value="${ex ? ex.time || '' : '21:00'}">`)}</div>
  <button class="btn block" onclick="if(!val('pd'))return toast('Pick a date');D().events=D().events.filter(e=>e.id!=='${eid}');D().events.push({id:'${eid}',title:'${jq(title)}',date:val('pd'),time:val('ph'),by:S().me});DB.save();closeSheet();render();toast('Added to Calendar')">Add to Calendar</button>`); }


/* =================== KARAOKE SONG LIST =================== */
const KLANG = ['English', 'Malay', 'Indonesian', 'Chinese', 'Korean', 'Japanese', 'Tamil', 'Other'];
const kWho = s => s.who === 'duet' ? '👫 Duet' : s.who === 'A' || s.who === 'B' ? '🎤 ' + whoName(s.who) : '🎤 Anyone';
const ytKaraoke = s => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(`${s.title} ${s.artist || ''} karaoke`);
function vKaraoke() {
  D().karaoke = D().karaoke || []; const all = D().karaoke, f = st.kFilter || 'all', q = (st.kq || '').toLowerCase();
  const FIL = [['all', 'All'], ['A', whoName('A')], ['B', whoName('B')], ['duet', 'Duets'], ['fav', '⭐ Favourites']];
  const l = all.filter(s => (f === 'all' || (f === 'fav' ? s.fav : s.who === f)) && (!q || (s.title + ' ' + (s.artist || '')).toLowerCase().includes(q)))
    .sort((a, b) => (b.fav ? 1 : 0) - (a.fav ? 1 : 0) || a.title.localeCompare(b.title));
  return `<p class="sub">Our songs for karaoke night. Tap 🎤 after you sing one.</p>
  <div class="chips" style="margin-bottom:10px">${FIL.map(([k, lb]) => `<button class="chip sm ${f === k ? 'on' : ''}" onclick="st.kFilter='${k}';render()">${esc(lb)}<span class="n">${k === 'all' ? all.length : all.filter(s => k === 'fav' ? s.fav : s.who === k).length}</span></button>`).join('')}</div>
  ${all.length > 6 ? `<input placeholder="Search songs or singers" value="${esc(st.kq || '')}" style="margin-bottom:10px" oninput="st.kq=this.value;render();const i=document.querySelector('#app input');i.focus();i.setSelectionRange(99,99)">` : ''}
  ${all.length > 2 ? `<button class="btn soft block" style="margin-bottom:12px" onclick="kSetlist()">🎲 Make tonight's setlist</button>` : ''}
  <div class="list">${l.map(s => `<div class="item" onclick="kSheet('${s.id}')"><button class="tlink" style="font-size:22px;padding:0 2px" onclick="event.stopPropagation();kFav('${s.id}')" aria-label="Favourite">${s.fav ? '⭐' : '☆'}</button>
    <div class="grow"><div class="t">${esc(s.title)}</div><div class="s">${[s.artist, kWho(s), s.lang, s.sung ? `sung ${s.sung}×` : ''].filter(Boolean).map(esc).join(' · ')}</div></div>
    <a class="btn soft sm" href="${ytKaraoke(s)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" aria-label="Find on YouTube">▶</a>
    <button class="btn soft sm" onclick="event.stopPropagation();kSang('${s.id}')" aria-label="We sang it">🎤</button></div>`).join('')
    || `<div class="empty">${all.length ? 'No songs match.' : 'No songs yet. Add the ones you love to sing, like Rasa Sayang, Perfect, or Kau Ilhamku.'}</div>`}</div>
  <button class="fab" onclick="kSheet()">+ Add song</button>`;
}
function kSheet(id) { const s = (D().karaoke || []).find(x => x.id === id) || {title: '', artist: '', who: st.kFilter === 'A' || st.kFilter === 'B' || st.kFilter === 'duet' ? st.kFilter : 'any', lang: 'English', key: '', note: '', fav: false};
  sheet(`<h2>${id ? 'Edit song' : 'Add a song'}</h2>${field('Song', `<input id="kst" value="${esc(s.title)}" placeholder="e.g. Perfect">`)}${field('Singer / artist', `<input id="ksa" value="${esc(s.artist || '')}" placeholder="e.g. Ed Sheeran">`)}
  ${field('Who sings it', `<div class="chips" id="ksw" style="flex-wrap:wrap">${[['A', whoName('A')], ['B', whoName('B')], ['duet', 'Duet'], ['any', 'Anyone']].map(([k, lb]) => `<button type="button" class="chip sm ${s.who === k ? 'on' : ''}" data-k="${k}" onclick="document.querySelectorAll('#ksw .chip').forEach(c=>c.classList.toggle('on',c===this))">${esc(lb)}</button>`).join('')}</div>`)}
  <div class="grid2">${field('Language', `<select id="ksl">${KLANG.map(o => `<option ${s.lang === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`)}${field('Key / pitch (optional)', `<input id="ksk" value="${esc(s.key || '')}" placeholder="e.g. -2">`)}</div>
  ${field('Notes', `<input id="ksn" value="${esc(s.note || '')}" placeholder="e.g. Start slow, the chorus is high">`)}
  <button class="btn block" onclick="kSave('${id || ''}')">Save</button>
  ${id ? `<a class="btn soft block" style="margin-top:10px;text-align:center" href="${ytKaraoke(s)}" target="_blank" rel="noopener">▶ Find karaoke version on YouTube</a><button class="btn red block" style="margin-top:10px" onclick="confirmDel(()=>delFrom('karaoke','${id}'))">Delete</button>` : ''}`); }
function kSave(id) { if (!val('kst')) return toast('Add the song title'); const w = document.querySelector('#ksw .chip.on');
  const o = {title: val('kst'), artist: val('ksa'), who: w ? w.dataset.k : 'any', lang: val('ksl'), key: val('ksk'), note: val('ksn')};
  D().karaoke = D().karaoke || []; if (id) Object.assign(D().karaoke.find(x => x.id === id), o); else { D().karaoke.push({id: uid(), by: S().me, added: Date.now(), fav: false, sung: 0, ...o}); act('🎤', `added "${o.title}" to karaoke`); }
  DB.save(); closeSheet(); render(); }
function kFav(id) { const s = D().karaoke.find(x => x.id === id); s.fav = !s.fav; DB.save(); render(); }
function kSang(id) { const s = D().karaoke.find(x => x.id === id); s.sung = (s.sung || 0) + 1; s.lastSung = todayISO(); DB.save(); render(); toast(`🎤 ${s.title}: sung ${s.sung}×`); }
function kSetlist() { const l = [...D().karaoke].sort(() => Math.random() - .5).slice(0, 6);
  sheet(`<h2>Tonight's setlist 🎤</h2><div class="list">${l.map((s, i) => `<div class="item"><b style="width:22px">${i + 1}</b><div class="grow"><div class="t">${esc(s.title)}</div><div class="s">${esc([s.artist, kWho(s)].filter(Boolean).join(' · '))}</div></div><a class="btn soft sm" href="${ytKaraoke(s)}" target="_blank" rel="noopener">▶</a></div>`).join('')}</div>
  <button class="btn soft block" style="margin-top:12px" onclick="kSetlist()">🎲 Shuffle again</button>`); }

/* ---------- start ---------- */
render();
// load the full copy from IndexedDB (newer or larger than the quick-start copy), THEN run the splash/PIN so the lock always sees the real settings
Promise.race([IMG.get('__data__'), new Promise(r => setTimeout(() => r(undefined), 4000))]).then(raw => { if (raw) { let t = 0; try { t = JSON.parse(raw).savedAt || 0; } catch (e) {} if (t > (DB.data.savedAt || 0)) { DB.load(raw); attachKidViews(); render(); } }
  else if (localStorage.getItem(KEY)) DB.save(true); }).finally(() => { openSequence(); SYNC.init(); });
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol === 'https:') { navigator.serviceWorker.register('sw.js').catch(() => {}); }
</script>
</body>
</html>
